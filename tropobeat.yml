################### {Beat} Configuration Example #########################

############################# {Beat} ######################################

tropobeat:
  # How often weather is fetched from Open-Meteo for every co-channel path
  # point and every LRF without paths. The first poll runs at start-up.
  # Each poll costs Open-Meteo API calls per location (see the rolling plan,
  # Q15), so check your plan's limits before shortening it.
  period: 1m

  # Limit tropobeat to these LRF codes, for limited runs and testing. Only
  # these LRFs' co-channel paths are discovered and only their weather is
  # fetched. Empty or unset means all LRFs.
  lrf_sites: ["TERH", "PROV", "BOS"]

  # Elasticsearch cluster that tropobeat reads reference data from (the LRF
  # sites loaded with `tropobeat insert lrfcoordinates`). This is separate
  # from the output where events are published.
  elasticsearch:
    hosts: ["http://10.9.0.69:9200"]
    # Store credentials in the keystore rather than in this file:
    #   tropobeat keystore add ES_PASSWORD
    #username: "tropobeat"
    #password: "${ES_PASSWORD}"
    #api_key: "${ES_API_KEY}"

  # Index holding the LRF sites.
  #lrf_index: "lrf-coordinates"

  # Index pattern holding the demod telemetry, used to find the RF channels
  # (and call signs) each LRF receives.
  #demod_index: "log-metric-p-rfdemod-*"

  # Index holding the FCC transmitters loaded with
  # `tropobeat insert fcctransmitters`. Schedule that import (cron) before
  # cochannel.schedule, e.g. at 02:00 UTC, so discovery reads a complete list.
  #fcc_index: "fcc-transmitters"

  # Daily co-channel discovery: for each LRF and received RF channel, find
  # same-channel transmitters within the radius, excluding the LRF's own
  # station. Also runs once at start-up.
  cochannel:
    # Cron expression, UTC.
    schedule: "0 3 * * *"
    # Search radius around each LRF.
    radius: "200mi"

  # Open-Meteo weather API (https://open-meteo.com).
  openmeteo:
    # Set to false to turn weather polling off: tropobeat then only runs the
    # daily co-channel discovery and makes no Open-Meteo calls.
    # enabled: false

    # API key for Open-Meteo commercial plans. Leave unset to use the free
    # API, which is for non-commercial use only. When set, requests go to
    # customer-api.open-meteo.com. Store the key in the keystore rather than
    # in this file:
    #   tropobeat keystore add OPENMETEO_API_KEY
    #api_key: "${OPENMETEO_API_KEY}"

    # Override the API endpoint, e.g. for a self-hosted Open-Meteo instance.
    #url: ""

    # Mock weather, for building and testing dashboards: serve simulated
    # weather instead of calling Open-Meteo. Weather and ducting events are
    # then simulated and tagged "mock-weather"; co-channel paths stay real.
    mock:
      enabled: true
      # mixed (every location cycles through all states, varying with
      # place), or one state everywhere: normal, super_refractive, ducting
      # (thin, traps nothing), elevated, trapped_uhf, trapped (traps VHF too).
      scenario: mixed
      # mixed only: how long each location takes to pass through every state.
      cycle: 20m
    # Timeout for each API request.
    timeout: 30s

  # Ducting calculation, run on every weather poll (see DUCTING.md).
  # "all" publishes a ducting event for every location on every poll;
  # "notable" only for super-refractive and ducting locations.
  #ducting:
    #publish: all

  # Daily demod baselines: the median Pre-FEC BER and MER of every demod
  # instance (host IP, slot and input) and RF channel, from the last
  # window_days whole days of demod telemetry. Live telemetry is judged
  # against them. Also runs once at start-up.
  #baseline:
    # Cron expression, UTC. Run after co-channel discovery.
    #schedule: "30 3 * * *"
    #window_days: 7
    # Fewest locked reports (about one a minute) for a usable baseline.
    #min_samples: 1440
    # Smallest BER baseline: most medians are 0, so a spike is measured
    # against max(median, ber_floor).
    #ber_floor: 1e-6
    # Treat the baselines as missing once they are this old (failed runs).
    #max_age: 48h
    # Publish each run's baselines as the baseline metricset.
    #publish: true

  # Live demod reports from RabbitMQ. Tropobeat declares its own queue,
  # bound to the demod exchange, and keeps it bounded (reports older than
  # message_ttl expire; beyond max_length the oldest are dropped).
  rabbitmq:
    enabled: true
    host: "10.9.0.69"
    port: 8910
    vhost: "/"
    username: "insite"
    # Required when enabled. Store it in the keystore rather than in this file:
    #   tropobeat keystore add RABBITMQ_PASSWORD
    password: "abacus"
    #ssl:
      #enabled: false
      #ca_cert: "/etc/tropobeat/rabbitmq-ca.pem"
      # For testing only.
      #insecure: false

    # The exchange the demod reports are published to. With
    # exchange_declare "passive" (default) tropobeat only checks that it
    # exists with this type and durability; "active" creates it, for
    # development and replay setups.
    #exchange: "x.tropobeat.demod"
    #exchange_type: "direct"
    #exchange_declare: "passive"
    #durable: true
    #routing_key: "demod.metrics"
    #queue: "q.tropobeat.demod"

    # Unacknowledged reports the broker sends ahead.
    #prefetch: 500
    #message_ttl: 5m
    #max_length: 50000
    # Reconnect delay: starts at reconnect_interval and doubles on each
    # failure up to reconnect_max.
    #reconnect_interval: 1s
    #reconnect_max: 30s

# ================================== General ===================================

# The name of the shipper that publishes the network data. It can be used to group
# all the transactions sent by a single shipper in the web interface.
#name:

# The tags of the shipper are included in their field with each
# transaction published.
#tags: ["service-X", "web-tier"]

# Optional fields that you can specify to add additional information to the
# output.
#fields:
#  env: staging

# ================================= Dashboards =================================
# These settings control loading the sample dashboards to the Kibana index. Loading
# the dashboards is disabled by default and can be enabled either by setting the
# options here or by using the `setup` command.
#setup.dashboards.enabled: false

# The URL from where to download the dashboard archive. By default, this URL
# has a value that is computed based on the Beat name and version. For released
# versions, this URL points to the dashboard archive on the artifacts.elastic.co
# website.
#setup.dashboards.url:

# =================================== Kibana ===================================

# Starting with Beats version 6.0.0, the dashboards are loaded via the Kibana API.
# This requires a Kibana endpoint configuration.
setup.kibana:

  # Kibana Host
  # Scheme and port can be left out and will be set to the default (http and 5601)
  # In case you specify and additional path, the scheme is required: http://localhost:5601/path
  # IPv6 addresses should always be defined as: https://[2001:db8::1]:5601
  #host: "localhost:5601"

  # Kibana Space ID
  # ID of the Kibana Space into which the dashboards should be loaded. By default,
  # the Default Space will be used.
  #space.id:

# =============================== Elastic Cloud ================================

# These settings simplify using Tropobeat with the Elastic Cloud (https://cloud.elastic.co/).

# The cloud.id setting overwrites the `output.elasticsearch.hosts` and
# `setup.kibana.host` options.
# You can find the `cloud.id` in the Elastic Cloud web UI.
#cloud.id:

# The cloud.auth setting overwrites the `output.elasticsearch.username` and
# `output.elasticsearch.password` settings. The format is `<user>:<pass>`.
#cloud.auth:

# ================================== Outputs ===================================

# Configure what output to use when sending the data collected by the beat.

# ---------------------------- Elasticsearch Output ----------------------------
output.elasticsearch:
  # Array of hosts to connect to.
  hosts: ["10.9.0.69:9200"]

  # Performance preset - one of "balanced", "throughput", "scale",
  # "latency", or "custom".
  preset: balanced

  # Protocol - either `http` (default) or `https`.
  #protocol: "https"

  # Authentication credentials - either API key or username/password.
  #api_key: "id:api_key"
  #username: "elastic"
  #password: "changeme"

# ------------------------------ Logstash Output -------------------------------
#output.logstash:
  # The Logstash hosts
  #hosts: ["localhost:5044"]

  # Optional SSL. By default is off.
  # List of root certificates for HTTPS server verifications
  #ssl.certificate_authorities: ["/etc/pki/root/ca.pem"]

  # Certificate for SSL client authentication
  #ssl.certificate: "/etc/pki/client/cert.pem"

  # Client Certificate Key
  #ssl.key: "/etc/pki/client/cert.key"

# ================================= Processors =================================

# Configure processors to enhance or manipulate events generated by the beat.

processors:
  - add_host_metadata: ~
  - add_cloud_metadata: ~
  - add_docker_metadata: ~


# ================================== Logging ===================================

# Sets log level. The default log level is info.
# Available log levels are: error, warning, info, debug
#logging.level: debug

# At debug level, you can selectively enable logging only for some components.
# To enable all selectors, use ["*"]. Examples of other selectors are "beat",
# "publisher", "service".
#logging.selectors: ["*"]

# ============================= X-Pack Monitoring ==============================
# Tropobeat can export internal metrics to a central Elasticsearch monitoring
# cluster.  This requires xpack monitoring to be enabled in Elasticsearch.  The
# reporting is disabled by default.

# Set to true to enable the monitoring reporter.
#monitoring.enabled: false

# Sets the UUID of the Elasticsearch cluster under which monitoring data for this
# Tropobeat instance will appear in the Stack Monitoring UI. If output.elasticsearch
# is enabled, the UUID is derived from the Elasticsearch cluster referenced by output.elasticsearch.
#monitoring.cluster_uuid:

# Uncomment to send the metrics to Elasticsearch. Most settings from the
# Elasticsearch outputs are accepted here as well.
# Note that the settings should point to your Elasticsearch *monitoring* cluster.
# Any setting that is not set is automatically inherited from the Elasticsearch
# output configuration, so if you have the Elasticsearch output configured such
# that it is pointing to your Elasticsearch monitoring cluster, you can simply
# uncomment the following line.
#monitoring.elasticsearch:

# ============================== Instrumentation ===============================

# Instrumentation support for the tropobeat.
#instrumentation:
    # Set to true to enable instrumentation of tropobeat.
    #enabled: false

    # Environment in which tropobeat is running on (eg: staging, production, etc.)
    #environment: ""

    # APM Server hosts to report instrumentation results to.
    #hosts:
    #  - http://localhost:8200

    # API Key for the APM Server(s).
    # If api_key is set then secret_token will be ignored.
    #api_key:

    # Secret token for the APM Server(s).
    #secret_token:


# ================================= Migration ==================================

# This allows to enable 6.7 migration aliases
#migration.6_to_7.enabled: true

