<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" width="1050" height="650" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="How tropobeat works: four sources feed four jobs, with the demod pollers outside tropobeat publishing the live reports to the RabbitMQ exchange; the jobs publish metricsets and keep ducting, baselines and live demod reports in memory for the planned correlation engine">
  <title>How tropobeat works</title>
  <rect width="1050" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Column headings -->
  <g font-weight="bold" fill="#222" font-size="14">
    <text x="20" y="38">Sources</text>
    <text x="310" y="38">Jobs inside tropobeat</text>
    <text x="605" y="38">Published metricsets</text>
    <text x="845" y="38">Live checks</text>
  </g>
  <line x1="20" y1="50" x2="1035" y2="50" stroke="#d5d8dc"/>

  <!-- Sources -->
  <g fill="#f4f6f7" stroke="#7f8c8d">
    <rect x="20" y="66" width="240" height="58" rx="4"/>
    <rect x="20" y="136" width="240" height="48" rx="4"/>
    <rect x="20" y="236" width="240" height="48" rx="4"/>
    <rect x="20" y="356" width="240" height="48" rx="4"/>
    <rect x="20" y="476" width="240" height="48" rx="4"/>
  </g>
  <g fill="#222" font-weight="bold">
    <text x="32" y="85">LRF list · FCC transmitters</text>
    <text x="32" y="155">Demod telemetry, last 24 h</text>
    <text x="32" y="255">Open-Meteo API</text>
    <text x="32" y="375">Demod telemetry, last 7 days</text>
    <text x="32" y="495">RabbitMQ demod exchange</text>
  </g>
  <g fill="#555" font-size="11">
    <text x="32" y="101">Elasticsearch, loaded with</text>
    <text x="32" y="115">tropobeat insert (e.g. from cron)</text>
    <text x="32" y="172">inSITE indices in Elasticsearch</text>
    <text x="32" y="272">weather at every path point</text>
    <text x="32" y="392">the same inSITE indices</text>
    <text x="32" y="512">live reports, ~1 a minute per input</text>
  </g>

  <!-- Demod pollers: outside tropobeat, they publish the live reports to the exchange -->
  <rect x="20" y="414" width="240" height="40" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="1.5 3" stroke-linecap="round"/>
  <text x="32" y="431" fill="#222" font-weight="bold">Demod pollers</text>
  <text x="32" y="446" fill="#555" font-size="11">inSITE, outside tropobeat</text>
  <path d="M140 454 V474" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Jobs -->
  <g fill="#d6eaf8" stroke="#1f4e79" stroke-width="1.5">
    <rect x="310" y="95" width="240" height="70" rx="6"/>
    <rect x="310" y="225" width="240" height="70" rx="6"/>
    <rect x="310" y="345" width="240" height="70" rx="6"/>
    <rect x="310" y="465" width="240" height="70" rx="6"/>
  </g>
  <g fill="#1f4e79" font-weight="bold" font-size="14">
    <text x="322" y="116">cochannel job</text>
    <text x="322" y="246">weather job</text>
    <text x="322" y="366">baseline job</text>
    <text x="322" y="486">demod stream</text>
  </g>
  <g fill="#555" font-size="11">
    <text x="322" y="134">daily 03:00 UTC + at start-up</text>
    <text x="322" y="150">co-channel paths within 200 mi</text>
    <text x="322" y="264">every period (default hourly)</text>
    <text x="322" y="280">+ ducting calculation</text>
    <text x="322" y="384">daily 03:30 UTC + at start-up</text>
    <text x="322" y="400">median BER and MER per demod input</text>
    <text x="322" y="504">connected from start-up</text>
    <text x="322" y="520">decode, acknowledge, count</text>
  </g>

  <!-- Sources to jobs -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M260 95 H284 V115 H308"/>
    <path d="M260 160 H284 V145 H308"/>
    <path d="M260 260 H308"/>
    <path d="M260 380 H308"/>
    <path d="M260 500 H308"/>
  </g>

  <!-- Co-channel paths feed the weather job -->
  <path d="M430 165 V223" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="199" fill="#555" font-size="11">co-channel paths (in memory)</text>

  <!-- Published metricsets -->
  <g fill="#ffffff" stroke="#1f4e79" stroke-width="1.2">
    <rect x="605" y="118" width="110" height="24" rx="12"/>
    <rect x="605" y="234" width="85" height="24" rx="12"/>
    <rect x="700" y="234" width="85" height="24" rx="12"/>
    <rect x="605" y="356" width="110" height="24" rx="12"/>
  </g>
  <g fill="#1f4e79" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <text x="660" y="134">cochannel</text>
    <text x="647.5" y="250">weather</text>
    <text x="742.5" y="250">ducting</text>
    <text x="660" y="372">baseline</text>
  </g>
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M550 130 H603"/>
    <path d="M550 246 H603"/>
    <path d="M550 368 H603"/>
  </g>

  <!-- In-memory feeds to the live checks -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M550 284 H843"/>
    <path d="M550 404 H843"/>
    <path d="M550 500 H843"/>
  </g>
  <g fill="#555" font-size="11" text-anchor="middle">
    <text x="696" y="278">latest ducting per path (in memory)</text>
    <text x="696" y="398">7-day baselines (in memory)</text>
    <text x="696" y="494">each report as it arrives</text>
    <text x="696" y="516">(Phase 4a: counted and logged)</text>
  </g>

  <!-- Correlation engine (planned) -->
  <rect x="845" y="225" width="195" height="310" rx="6" fill="#fbfcfc" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="857" y="248" fill="#222" font-weight="bold" font-size="14">Correlation engine</text>
  <text x="857" y="265" fill="#7f8c8d" font-size="11">Phase 4b · planned</text>
  <g fill="#555" font-size="11">
    <text x="857" y="296">BER spike or MER drop,</text>
    <text x="857" y="311">against each input's baseline</text>
    <text x="857" y="341">held for 3 one-minute cycles</text>
    <text x="857" y="356">before any state change</text>
    <text x="857" y="386">sides A and B degraded and</text>
    <text x="857" y="401">dM/dh &lt; 0 on a co-channel</text>
    <text x="857" y="416">path → environmental CCI</text>
    <text x="857" y="446">every channel at an LRF lost,</text>
    <text x="857" y="461">no ducting → local outage</text>
  </g>

  <!-- Output of the engine (planned) -->
  <path d="M942 535 V563" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-grey)"/>
  <rect x="845" y="565" width="195" height="28" rx="14" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="942.5" y="583" fill="#555" font-size="12" text-anchor="middle">events and alerts · Phase 4c</text>

  <!-- Legend -->
  <g transform="translate(20,622)" font-size="12" fill="#222">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="42" y="4">data flow</text>
    <rect x="130" y="-9" width="34" height="18" rx="4" fill="#d6eaf8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="172" y="4">scheduled or live job</text>
    <rect x="320" y="-9" width="46" height="18" rx="9" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="374" y="4">metricset in the tropobeat data stream</text>
    <rect x="620" y="-9" width="34" height="18" rx="4" fill="#fbfcfc" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="662" y="4">planned</text>
    <rect x="740" y="-9" width="34" height="18" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="1.5 3" stroke-linecap="round"/>
    <text x="782" y="4">outside tropobeat</text>
  </g>
</svg>
