<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Score against the steepest gradient dN/dh, with the four refraction classes">
  <title>Score bands and classes</title>
  <rect width="780" height="330" fill="#ffffff"/>
  <!-- x = 40 + (20 - g) * 1.9444 ; y = 200 - 140 * score -->

  <!-- Score axis and grid -->
  <text x="20" y="30" fill="#222" font-weight="bold">score</text>
  <line x1="40" y1="60" x2="740" y2="60" stroke="#e5e5e5"/>
  <line x1="40" y1="116" x2="740" y2="116" stroke="#bbbbbb" stroke-dasharray="5 4"/>
  <line x1="40" y1="200" x2="740" y2="200" stroke="#555" stroke-width="1.2"/>
  <text x="32" y="64" text-anchor="end" fill="#555">1.0</text>
  <text x="32" y="120" text-anchor="end" fill="#555">0.6</text>
  <text x="32" y="204" text-anchor="end" fill="#555">0</text>

  <!-- Class boundaries -->
  <line x1="78.9" y1="50" x2="78.9" y2="262" stroke="#cccccc"/>
  <line x1="232.5" y1="50" x2="232.5" y2="262" stroke="#cccccc"/>
  <line x1="384.2" y1="50" x2="384.2" y2="262" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="662.2" y1="50" x2="662.2" y2="262" stroke="#cccccc"/>
  <text x="390" y="48" fill="#c0392b">dM/dh &lt; 0 to the right</text>

  <!-- Score curve -->
  <polyline points="40,200 232.5,200 384.2,116 662.2,60 740,60" fill="none" stroke="#1f4e79" stroke-width="3"/>

  <!-- TERH worked example points -->
  <circle cx="159" cy="200" r="5" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="159" y="188" text-anchor="middle" fill="#222">transmitter 0</text>
  <circle cx="297.4" cy="164" r="5" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="290" y="152" text-anchor="end" fill="#222">midpoint 0.26</text>
  <circle cx="397.6" cy="113.3" r="5" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="405" y="134" fill="#222">TERH LRF 0.62</text>

  <!-- Class bands -->
  <rect x="40" y="220" width="38.9" height="40" fill="#eeeeee"/>
  <rect x="78.9" y="220" width="153.6" height="40" fill="#e3f1e4"/>
  <rect x="232.5" y="220" width="151.7" height="40" fill="#fff1c2"/>
  <rect x="384.2" y="220" width="355.8" height="40" fill="#f6d2d5"/>
  <text x="59.5" y="244" text-anchor="middle" font-size="11" fill="#222">sub</text>
  <text x="155.7" y="244" text-anchor="middle" fill="#222">normal</text>
  <text x="308.4" y="244" text-anchor="middle" fill="#222">super_refractive</text>
  <text x="562" y="244" text-anchor="middle" fill="#222">ducting</text>

  <!-- Gradient axis -->
  <text x="78.9" y="280" text-anchor="middle" fill="#555">0</text>
  <text x="232.5" y="280" text-anchor="middle" fill="#555">−79</text>
  <text x="384.2" y="280" text-anchor="middle" fill="#555">−157</text>
  <text x="662.2" y="280" text-anchor="middle" fill="#555">−300</text>
  <text x="390" y="310" text-anchor="middle" fill="#222">steepest gradient dN/dh (N-units per km): more negative means stronger bending →</text>
</svg>
