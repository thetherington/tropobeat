<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="TERH worked example: N and M against height, with a surface duct from 2 to 230 m">
  <title>TERH worked example: N and M profile</title>
  <rect width="760" height="420" fill="#ffffff"/>
  <!-- y = 330 - h * 0.56 (h in m above ground). N panel: x = 60 + (N - 280) * 4.5. M panel: x = 60 + (M - 345) * 6 -->

  <!-- ===== Panel 1: N ===== -->
  <g transform="translate(10,20)">
    <text x="195" y="10" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Refractivity N</text>
    <text x="195" y="28" text-anchor="middle" fill="#555">falls 37 N-units in 228 m: −163.9 N/km</text>
    <rect x="60" y="201.2" width="270" height="127.7" fill="#d6eaf8" stroke="#85c1e9"/>
    <!-- grid and axes -->
    <g stroke="#eeeeee">
      <line x1="60" y1="274" x2="330" y2="274"/><line x1="60" y1="218" x2="330" y2="218"/>
      <line x1="60" y1="162" x2="330" y2="162"/><line x1="60" y1="106" x2="330" y2="106"/>
      <line x1="60" y1="50" x2="330" y2="50"/>
    </g>
    <line x1="60" y1="330" x2="330" y2="330" stroke="#555" stroke-width="1.2"/>
    <line x1="60" y1="330" x2="60" y2="50" stroke="#555" stroke-width="1.2"/>
    <g fill="#555" text-anchor="end">
      <text x="54" y="334">0</text><text x="54" y="278">100</text><text x="54" y="222">200</text>
      <text x="54" y="166">300</text><text x="54" y="110">400</text><text x="54" y="54">500</text>
    </g>
    <g fill="#555" text-anchor="middle">
      <text x="60" y="348">280</text><text x="150" y="348">300</text><text x="240" y="348">320</text><text x="330" y="348">340</text>
    </g>
    <text x="195" y="368" text-anchor="middle" fill="#555">N-units</text>
    <text x="16" y="190" text-anchor="middle" fill="#555" transform="rotate(-90 16 190)">height above ground (m)</text>
    <!-- profile -->
    <polyline points="294.45,328.9 126.15,201.2 103.65,78" fill="none" stroke="#1f4e79" stroke-width="2.5"/>
    <line x1="294.45" y1="328.9" x2="126.15" y2="201.2" stroke="#c0392b" stroke-width="5"/>
    <circle cx="294.45" cy="328.9" r="4.5" fill="#1f4e79"/>
    <circle cx="126.15" cy="201.2" r="4.5" fill="#1f4e79"/>
    <circle cx="103.65" cy="78" r="4.5" fill="#1f4e79"/>
    <circle cx="288.5" cy="318.8" r="4.5" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
    <line x1="210" y1="310" x2="283" y2="318" stroke="#999999"/>
    <text x="205" y="304" text-anchor="end" fill="#888888">1000 hPa dropped</text>
    <text x="205" y="320" text-anchor="end" fill="#888888">(only 18 m up)</text>
    <text x="300" y="322" fill="#222">surface</text>
    <text x="134" y="197" fill="#222">975 hPa</text>
    <text x="111" y="74" fill="#222">950 hPa</text>
    <text x="118" y="140" fill="#555">−23 N/km, normal</text>
  </g>

  <!-- ===== Panel 2: M ===== -->
  <g transform="translate(390,20)">
    <text x="195" y="10" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Modified refractivity M</text>
    <text x="195" y="28" text-anchor="middle" fill="#555">falls 1.6 M-units from the ground up: a surface duct</text>
    <rect x="60" y="201.2" width="270" height="127.7" fill="#d6eaf8" stroke="#85c1e9"/>
    <g stroke="#eeeeee">
      <line x1="60" y1="274" x2="330" y2="274"/><line x1="60" y1="218" x2="330" y2="218"/>
      <line x1="60" y1="162" x2="330" y2="162"/><line x1="60" y1="106" x2="330" y2="106"/>
      <line x1="60" y1="50" x2="330" y2="50"/>
    </g>
    <line x1="60" y1="330" x2="330" y2="330" stroke="#555" stroke-width="1.2"/>
    <line x1="60" y1="330" x2="60" y2="50" stroke="#555" stroke-width="1.2"/>
    <g fill="#555" text-anchor="end">
      <text x="54" y="334">0</text><text x="54" y="278">100</text><text x="54" y="222">200</text>
      <text x="54" y="166">300</text><text x="54" y="110">400</text><text x="54" y="54">500</text>
    </g>
    <g fill="#555" text-anchor="middle">
      <text x="90" y="348">350</text><text x="150" y="348">360</text><text x="210" y="348">370</text>
      <text x="270" y="348">380</text><text x="330" y="348">390</text>
    </g>
    <text x="195" y="368" text-anchor="middle" fill="#555">M-units</text>
    <polyline points="125.4,328.9 116.4,201.2 293.4,78" fill="none" stroke="#1f4e79" stroke-width="2.5"/>
    <line x1="125.4" y1="328.9" x2="116.4" y2="201.2" stroke="#c0392b" stroke-width="5"/>
    <circle cx="125.4" cy="328.9" r="4.5" fill="#1f4e79"/>
    <circle cx="116.4" cy="201.2" r="4.5" fill="#1f4e79"/>
    <circle cx="293.4" cy="78" r="4.5" fill="#1f4e79"/>
    <text x="134" y="322" fill="#222">surface 355.9</text>
    <text x="124" y="219" fill="#222">duct top 354.4 (230 m)</text>
    <text x="140" y="262" fill="#c0392b">dM/dh = −6.9: M falls</text>
    <text x="200" y="190" fill="#555">+134 M/km, normal</text>
    <text x="250" y="74" text-anchor="end" fill="#222">950 hPa 383.9</text>
  </g>

  <!-- Legend -->
  <g transform="translate(70,405)">
    <rect x="0" y="-11" width="24" height="14" fill="#d6eaf8" stroke="#85c1e9"/>
    <text x="32" y="0" fill="#222">surface duct, 2–230 m (228 m thick, traps above about 105 MHz)</text>
    <line x1="470" y1="-4" x2="494" y2="-4" stroke="#c0392b" stroke-width="5"/>
    <text x="502" y="0" fill="#222">trapping layer</text>
  </g>
</svg>
