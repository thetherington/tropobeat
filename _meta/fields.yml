- key: tropobeat
  title: tropobeat
  description: >
    Fields published by tropobeat: co-channel paths (metricset cochannel), the
    weather along them (metricset weather), the ducting analysis of each
    weather location (metricset ducting), the 7-day baseline of each
    demod instance (metricset baseline), and the correlation engine's
    verdicts (metricset correlation) and decision trace (metricset
    correlation_trace). See DUCTING.md for how ducting results are
    calculated and read, and CORRELATION.md for the correlation engine.
  fields:
    - name: metricset
      type: group
      fields:
        - name: name
          type: keyword
          description: >
            The kind of event: cochannel, weather, ducting, baseline,
            correlation or correlation_trace.

    # Fields shared by every metricset, directly under tropobeat, so one
    # dashboard filter or search works across all of them. Lists are always
    # arrays, sorted and without duplicates; empty ones are left out.
    - name: tropobeat.lrf_codes
      type: keyword
      description: >
        LRF codes (upper-case) the event is about: the path's LRF, the LRFs
        whose weather used a ducting location, or the baseline's LRF.
    - name: tropobeat.path_ids
      type: keyword
      description: >
        Co-channel paths, "<lrf code>:<facility id>:<rf channel>": the path
        itself, the paths whose weather used a ducting location, or the paths
        on a baseline's LRF and channel. Not set for an LRF without paths.
    - name: tropobeat.rf_channels
      type: integer
      description: RF channels of the path, the paths using a location, or the baseline.
    - name: tropobeat.bands
      type: keyword
      description: >
        TV bands of rf_channels: low_vhf (2-6), high_vhf (7-13) or uhf
        (14-69). Whether a duct traps a channel depends on its band.
    - name: tropobeat.transmitter_call_signs
      type: keyword
      description: >
        Call signs of the co-channel transmitters on the paths: the stations
        that could interfere. Not the LRF's own stations.
    - name: tropobeat.transmitter_facility_ids
      type: keyword
      description: >
        FCC facility IDs of those transmitters. Stable when a call sign
        changes.
    - name: tropobeat.transmitter_labels
      type: keyword
      description: >
        Readable names of those transmitters: the call sign, or for a
        station with several transmitter sites on the channel, which site,
        e.g. "WVER site 2 of 4 (5 kW)".
    - name: tropobeat.station_call_signs
      type: keyword
      description: >
        The LRF's own stations on the channel(s), from the demod input tags.
    - name: tropobeat.discovery_run_id
      type: keyword
      description: >
        Co-channel discovery run the paths came from. Filter on the latest to
        see the current paths. A baseline's own run is
        tropobeat.baseline.run_id.
    - name: tropobeat.forecast_time
      type: date
      description: >
        The hour the weather applies to (weather and ducting events).
        @timestamp is when it was fetched.
    - name: tropobeat.ducting_state
      type: keyword
      description: >
        normal, super_refractive, ducting (a ducting layer, but no duct thick
        enough to trap the channel) or trapping (a duct traps the channel).
        On a weather event it covers the path's points; on a ducting event
        the location, trapping when a duct traps the channel of any path
        using it. Not set when nothing could be analysed. See DUCTING.md.
    - name: tropobeat.ducting_level
      type: integer
      description: >
        ducting_state as 0 (normal) to 3 (trapping), for taking the maximum
        over time or across paths.

    - name: tropobeat.cochannel
      type: group
      description: >
        A co-channel path found by the daily discovery run: an LRF, a
        same-channel FCC transmitter within the search radius that is not the
        LRF's own station, and the geodesic midpoint between them.
      fields:
        - name: lrf
          type: group
          fields:
            - name: location
              type: geo_point
              description: LRF location.
        - name: transmitter
          type: group
          fields:
            - name: service
              type: keyword
            - name: site
              type: integer
              description: >
                Which of the station's transmitter sites on this channel this
                is, strongest first (1 for a single-site station).
            - name: sites
              type: integer
              description: >
                How many transmitter sites the station has on this channel
                (more than 1 for a distributed transmission system).
            - name: label
              type: keyword
              description: >
                Readable name: the call sign, or e.g. "WVER site 2 of 4 (5 kW)".
            - name: antenna_id
              type: keyword
              description: FCC antenna record ID of the site.
            - name: erp_kw
              type: float
              description: Effective radiated power, kW.
            - name: location
              type: geo_point
              description: Transmitter location.
        - name: midpoint
          type: group
          fields:
            - name: location
              type: geo_point
              description: Geodesic midpoint of the path (WGS84).
        - name: distance_mi
          type: float
          description: Geodesic length of the path, statute miles.
        - name: bearing_deg
          type: float
          description: Initial bearing from the LRF to the transmitter, degrees from north.
        - name: path
          type: geo_shape
          description: >
            The path as a GeoJSON LineString (LRF, midpoint, transmitter), so
            Kibana Maps can draw it.

    - name: tropobeat.weather
      type: group
      description: >
        Weather from Open-Meteo for one co-channel path (its LRF, midpoint and
        transmitter), or for an LRF that has no co-channel paths.
      fields:
        - name: path
          type: geo_shape
          description: >
            The path as a GeoJSON LineString (LRF, midpoint, transmitter), so
            Kibana Maps can draw it. Not set for an LRF without paths.
        - name: ducting
          type: group
          description: >
            Path ducting summary. Not set for an LRF without paths.
          fields:
            - name: index
              type: float
              description: >
                Path ducting index, 0-1: the mean of the usable points'
                ducting scores.
            - name: frequency_mhz
              type: float
              description: Centre frequency of the path's RF channel, MHz.
            - name: trapped
              type: boolean
              description: >
                True if a duct at any of the path's points is thick enough to
                trap the channel's frequency.
        - name: lrf
          type: group
          fields: &point_fields
            - name: ducting
              type: group
              description: >
                Ducting summary for this point. Not set when the location had
                too few usable heights to analyse.
              fields:
                - name: profile_id
                  type: keyword
                  description: >
                    Links to this location's ducting event
                    (tropobeat.ducting.profile_id) from the same poll.
                - name: score
                  type: float
                  description: Ducting likelihood score, 0-1.
                - name: class
                  type: keyword
                  description: >
                    Refraction class of the steepest layer: sub_refractive,
                    normal, super_refractive or ducting.
                - name: min_dndh_n_per_km
                  type: float
                  description: Steepest refractivity gradient dN/dh, N-units per km.
            - name: location
              type: geo_point
            - name: elevation_m
              type: float
              description: Terrain elevation, metres.
            - name: surface
              type: group
              fields: &level_fields
                - name: pressure_hpa
                  type: float
                - name: height_m
                  type: float
                  description: Height above sea level, metres.
                - name: temperature_k
                  type: float
                - name: relative_humidity_pct
                  type: float
            - name: levels
              type: group
              description: >
                Pressure levels in increasing height (an array). Levels below
                the terrain are included as returned by Open-Meteo.
              fields: *level_fields
        - name: midpoint
          type: group
          fields: *point_fields
        - name: transmitter
          type: group
          fields: *point_fields

    - name: tropobeat.ducting
      type: group
      description: >
        Ducting analysis of one weather location for one poll: refractivity
        at each usable height, the gradient of each layer, and any ducts.
        One event per unique location; weather points link to it by
        profile_id. See DUCTING.md.
      fields:
        - name: profile_id
          type: keyword
          description: >
            The location the weather was requested for, as "lat,lon"
            (rounded when coordinate_precision is set).
        - name: location
          type: geo_point
        - name: elevation_m
          type: float
          description: Terrain elevation, metres.
        - name: class
          type: keyword
          description: >
            Refraction class of the steepest layer: sub_refractive, normal,
            super_refractive or ducting; insufficient_data when there were
            fewer than two usable heights.
        - name: score
          type: float
          description: >
            Ducting likelihood score, 0-1. Not set for insufficient_data.
        - name: min_dndh_n_per_km
          type: float
          description: >
            Steepest refractivity gradient dN/dh, N-units per km. Not set for
            insufficient_data.
        - name: dropped_levels
          type: integer
          description: >
            Pressure levels left out: below the terrain, under min_layer_m
            above the point below, or with missing values.
        - name: points
          type: group
          description: >
            Usable heights, lowest first (an array): the 2 m surface point,
            then each kept pressure level.
          fields:
            - name: pressure_hpa
              type: float
            - name: height_m
              type: float
              description: Height above sea level, metres.
            - name: height_agl_m
              type: float
              description: Height above ground, metres.
            - name: temperature_k
              type: float
            - name: relative_humidity_pct
              type: float
            - name: vapour_pressure_hpa
              type: float
              description: Water vapour pressure e, hPa.
            - name: refractivity_n
              type: float
              description: Radio refractivity N, N-units.
            - name: modified_refractivity_m
              type: float
              description: Modified refractivity M = N + 0.157 h (h above sea level), M-units.
        - name: layers
          type: group
          description: The air between consecutive points (an array), lowest first.
          fields:
            - name: base_agl_m
              type: float
            - name: top_agl_m
              type: float
            - name: dndh_n_per_km
              type: float
              description: Refractivity gradient dN/dh, N-units per km.
            - name: dmdh_m_per_km
              type: float
              description: Modified refractivity gradient dM/dh, M-units per km. Negative means ducting.
            - name: class
              type: keyword
              description: sub_refractive, normal, super_refractive or ducting.
        - name: ducts
          type: group
          description: Ducts found (an array), lowest first; empty when none.
          fields:
            - name: type
              type: keyword
              description: surface, surface_based or elevated.
            - name: base_agl_m
              type: float
            - name: top_agl_m
              type: float
            - name: thickness_m
              type: float
            - name: delta_m
              type: float
              description: >
                Duct strength: M at the base of the trapping layer minus M at
                its top, M-units.

    - name: tropobeat.baseline
      type: group
      description: >
        The normal Pre-FEC BER and MER of one demod instance on one RF channel:
        the medians of its locked reports over the baseline window (whole UTC
        days up to the start of the run's day). Published by the daily
        baseline run; use the latest run_id. Live telemetry is judged against
        these values.
      fields:
        - name: run_id
          type: keyword
          description: Baseline run this record belongs to. Use the latest run.
        - name: instance
          type: group
          description: >
            The demod input: the demod frame's host IP, the card slot and the
            input on the card.
          fields:
            - name: id
              type: keyword
              description: Instance identifier, "<host ip>/<slot>/<input>".
            - name: host_ip
              type: ip
            - name: slot
              type: integer
            - name: input
              type: integer
        - name: lrf
          type: group
          fields:
            - name: location
              type: geo_point
              description: LRF location, when the code is in the LRF list.
        - name: demod_side
          type: keyword
          description: Demod side, A or B.
        - name: card_label
          type: keyword
        - name: frame_label
          type: keyword
        - name: tags
          type: keyword
          description: >
            Input tags seen in the window. The call signs parsed from them are
            tropobeat.station_call_signs.
        - name: status
          type: keyword
          description: >
            ok (used to judge live telemetry), insufficient (fewer than
            baseline.min_samples locked reports), invalid (saturated or
            missing BER median) or no_station (the tags name no station, e.g.
            spare inputs).
        - name: samples
          type: long
          description: Locked reports the medians cover.
        - name: window
          type: group
          fields:
            - name: start
              type: date
              description: First locked report in the window.
            - name: end
              type: date
              description: Last locked report in the window.
            - name: days
              type: float
              description: Days between the first and last report.
        - name: ber
          type: group
          fields:
            - name: median
              type: double
              description: Median Pre-FEC BER.
            - name: effective
              type: double
              description: >
                The BER a spike is measured against: the median, or
                baseline.ber_floor when the median is lower (usually 0).
            - name: spike_threshold
              type: double
              description: >
                BER at or above which a live report is a spike:
                correlator.ber_factor x effective. For reference.
        - name: mer
          type: group
          fields:
            - name: median_db
              type: float
              description: Median MER, dB.
            - name: drop_threshold_db
              type: float
              description: >
                MER at or below which a live report is a drop: the median
                minus correlator.mer_drop_db. For reference.

    - name: tropobeat.correlation
      type: group
      description: >
        A verdict of the correlation engine for one LRF and RF channel (its
        A/B pair): whether the degradation of the channel is co-channel
        interference carried by a duct. Published when the verdict starts,
        changes, clears, and every correlator.snapshot_interval while it is
        not clear. See CORRELATION.md.
      fields:
        - name: kind
          type: keyword
          description: >
            start (the pair left clear), update (the state or, while
            cci_confirmed, the ducting evidence changed), ongoing
            (re-published every correlator.snapshot_interval) or clear.
        - name: state
          type: keyword
          description: >
            clear, single_side, unpaired, dual_ducting_unknown,
            dual_unexplained or cci_confirmed. See CORRELATION.md.
        - name: previous_state
          type: keyword
        - name: severity
          type: integer
          description: >
            The state as 0 (clear) to 5 (cci_confirmed).
        - name: reason
          type: keyword
          description: >
            The rule that decided the state.
        - name: strength
          type: keyword
          description: >
            For cci_confirmed: ducting or trapping, from the strongest path.
        - name: episode
          type: group
          fields:
            - name: id
              type: keyword
              description: >
                "<lrf>:<rf channel>:<start>"; shared by every event and trace
                record of one episode.
            - name: start
              type: date
            - name: duration_s
              type: float
              description: >
                Seconds since the episode started.
            - name: peak_state
              type: keyword
              description: >
                Most severe state reached in the episode.
        - name: lrf
          type: group
          fields:
            - name: location
              type: geo_point
              description: >
                LRF location, when the code is in the LRF list.
        - name: sides
          type: group
          fields:
            - name: a
              type: group
              description: >
                Side A of the pair.
              fields:
                - name: view
                  type: keyword
                  description: >
                    degraded, recovering (still degraded but reporting clean again:
                    keeps an open verdict it was part of, never starts or joins one), clean, guarded (degraded
                    only by lock loss while
                    its whole frame is unlocked), stale (no recent report) or
                    missing (no input on this side for the channel).
                - name: since
                  type: date
                  description: >
                    When the side's degradation began.
                - name: conditions
                  type: keyword
                  description: >
                    Anomalies across the side's fresh inputs.
                - name: instance_ids
                  type: keyword
                - name: signatures
                  type: keyword
                - name: ber
                  type: double
                  description: >
                    Highest BER across the side's fresh inputs.
                - name: mer_db
                  type: integer
                  description: >
                    Lowest MER across the side's fresh inputs, dB.
                - name: power_dbm
                  type: integer
                  description: >
                    Lowest power across the side's fresh inputs, dBm.
                - name: instances
                  type: group
                  description: >
                    Every input on this side for the channel.
                  fields:
                    - name: id
                      type: keyword
                      description: >
                        Demod input, "<host ip>/<slot>/<input>".
                    - name: host_ip
                      type: ip
                    - name: slot
                      type: integer
                    - name: input
                      type: integer
                    - name: side
                      type: keyword
                      description: >
                        Demod side reported, A or B (empty when the input
                        reports none).
                    - name: card_label
                      type: keyword
                    - name: frame_label
                      type: keyword
                    - name: report_time
                      type: date
                      description: >
                        Timestamp of the input's latest report.
                    - name: fresh
                      type: boolean
                      description: >
                        Whether the latest report is recent enough
                        (correlator.stale_after) to count.
                    - name: locked
                      type: boolean
                    - name: ber
                      type: double
                      description: >
                        Latest Pre-FEC BER.
                    - name: mer_db
                      type: integer
                      description: >
                        Latest MER, dB.
                    - name: power_dbm
                      type: integer
                      description: >
                        Latest input power, dBm.
                    - name: ber_effective
                      type: double
                      description: >
                        The baseline BER a spike is measured against.
                    - name: ber_threshold
                      type: double
                      description: >
                        BER at or above which a report is a spike:
                        correlator.ber_factor x ber_effective.
                    - name: mer_median_db
                      type: float
                      description: >
                        Baseline median MER, dB.
                    - name: mer_threshold_db
                      type: float
                      description: >
                        MER at or below which a report is a drop: the median
                        minus correlator.mer_drop_db.
                    - name: conditions
                      type: keyword
                      description: >
                        Anomalies on the latest report: ber_spike,
                        ber_saturated, mer_drop, lock_lost.
                    - name: degraded
                      type: boolean
                      description: >
                        Anomalous for correlator.hysteresis_cycles reports in
                        a row, and not yet clean for as many.
                    - name: stressed
                      type: boolean
                      description: >
                        Environmentally Stressed: a BER spike held for
                        correlator.hysteresis_cycles reports while locked.
                    - name: bad
                      type: integer
                      description: >
                        Consecutive anomalous reports.
                    - name: good
                      type: integer
                      description: >
                        Consecutive clean reports.
                    - name: signature
                      type: keyword
                      description: >
                        For a degraded input: steady_or_rising (power held,
                        typical of interference), dropping (power fell by
                        correlator.power_drop_db or more: a fade, feed or
                        transmitter problem) or unlocked.
                    - name: power_delta_db
                      type: float
                      description: >
                        Power now minus the median of its clean readings
                        before the degradation began, dB.
            - name: b
              type: group
              description: >
                Side B of the pair.
              fields:
                - name: view
                  type: keyword
                  description: >
                    degraded, recovering (still degraded but reporting clean again:
                    keeps an open verdict it was part of, never starts or joins one), clean, guarded (degraded
                    only by lock loss while
                    its whole frame is unlocked), stale (no recent report) or
                    missing (no input on this side for the channel).
                - name: since
                  type: date
                  description: >
                    When the side's degradation began.
                - name: conditions
                  type: keyword
                  description: >
                    Anomalies across the side's fresh inputs.
                - name: instance_ids
                  type: keyword
                - name: signatures
                  type: keyword
                - name: ber
                  type: double
                  description: >
                    Highest BER across the side's fresh inputs.
                - name: mer_db
                  type: integer
                  description: >
                    Lowest MER across the side's fresh inputs, dB.
                - name: power_dbm
                  type: integer
                  description: >
                    Lowest power across the side's fresh inputs, dBm.
                - name: instances
                  type: group
                  description: >
                    Every input on this side for the channel.
                  fields:
                    - name: id
                      type: keyword
                      description: >
                        Demod input, "<host ip>/<slot>/<input>".
                    - name: host_ip
                      type: ip
                    - name: slot
                      type: integer
                    - name: input
                      type: integer
                    - name: side
                      type: keyword
                      description: >
                        Demod side reported, A or B (empty when the input
                        reports none).
                    - name: card_label
                      type: keyword
                    - name: frame_label
                      type: keyword
                    - name: report_time
                      type: date
                      description: >
                        Timestamp of the input's latest report.
                    - name: fresh
                      type: boolean
                      description: >
                        Whether the latest report is recent enough
                        (correlator.stale_after) to count.
                    - name: locked
                      type: boolean
                    - name: ber
                      type: double
                      description: >
                        Latest Pre-FEC BER.
                    - name: mer_db
                      type: integer
                      description: >
                        Latest MER, dB.
                    - name: power_dbm
                      type: integer
                      description: >
                        Latest input power, dBm.
                    - name: ber_effective
                      type: double
                      description: >
                        The baseline BER a spike is measured against.
                    - name: ber_threshold
                      type: double
                      description: >
                        BER at or above which a report is a spike:
                        correlator.ber_factor x ber_effective.
                    - name: mer_median_db
                      type: float
                      description: >
                        Baseline median MER, dB.
                    - name: mer_threshold_db
                      type: float
                      description: >
                        MER at or below which a report is a drop: the median
                        minus correlator.mer_drop_db.
                    - name: conditions
                      type: keyword
                      description: >
                        Anomalies on the latest report: ber_spike,
                        ber_saturated, mer_drop, lock_lost.
                    - name: degraded
                      type: boolean
                      description: >
                        Anomalous for correlator.hysteresis_cycles reports in
                        a row, and not yet clean for as many.
                    - name: stressed
                      type: boolean
                      description: >
                        Environmentally Stressed: a BER spike held for
                        correlator.hysteresis_cycles reports while locked.
                    - name: bad
                      type: integer
                      description: >
                        Consecutive anomalous reports.
                    - name: good
                      type: integer
                      description: >
                        Consecutive clean reports.
                    - name: signature
                      type: keyword
                      description: >
                        For a degraded input: steady_or_rising (power held,
                        typical of interference), dropping (power fell by
                        correlator.power_drop_db or more: a fade, feed or
                        transmitter problem) or unlocked.
                    - name: power_delta_db
                      type: float
                      description: >
                        Power now minus the median of its clean readings
                        before the degradation began, dB.
        - name: ducting
          type: group
          description: >
            The ducting on the co-channel paths of the channel, as looked up
            for the decision.
          fields:
            - name: status
              type: keyword
              description: >
                fresh, stale (the last weather poll is older than 2 x period)
                or no_poll.
            - name: polled_at
              type: date
              description: >
                When the ducting results were computed (weather poll time).
            - name: forecast_time
              type: date
              description: >
                The hour the weather applies to.
            - name: paths_on_channel
              type: integer
              description: >
                Co-channel paths on the LRF and channel.
            - name: paths_unknown
              type: integer
              description: >
                Of those, paths with no usable weather (an incomplete fetch):
                their ducting is unknown.
            - name: strongest
              type: group
              description: >
                The co-channel path with the highest ducting state, the
                nearest winning a tie.
              fields:
                - name: path_id
                  type: keyword
                - name: call_sign
                  type: keyword
                  description: >
                    The likely interfering transmitter.
                - name: label
                  type: keyword
                  description: >
                    Its readable name, naming the site for multi-site
                    stations, e.g. "WVER site 2 of 4 (5 kW)".
                - name: facility_id
                  type: keyword
                - name: distance_mi
                  type: float
                - name: state
                  type: keyword
                  description: >
                    normal, super_refractive, ducting or trapping.
                - name: level
                  type: integer
                  description: >
                    The state as 0 (normal) to 3 (trapping).
                - name: ducting_points
                  type: keyword
                  description: >
                    Points of the path with dM/dh < 0: lrf, midpoint,
                    transmitter.
            - name: active_path_ids
              type: keyword
              description: >
                Paths on the channel that are ducting or trapping.
            - name: active_call_signs
              type: keyword
              description: >
                Their transmitters.
            - name: active_labels
              type: keyword
              description: >
                Their transmitters' readable names (see strongest.label).

    - name: tropobeat.correlation_trace
      type: group
      description: >
        A decision-trace record of the correlation engine: how it judged a
        report, an input, a pair or the ducting, and why. Categories are
        enabled with correlator.trace.categories.
      fields:
        - name: category
          type: keyword
          description: >
            input, skip, hysteresis, pair, ducting or sweep
            (correlator.trace.categories).
        - name: reason
          type: keyword
          description: >
            Short code of what was decided. See CORRELATION.md for every code.
        - name: decision
          type: keyword
          description: >
            hit (an anomaly or CCI found), miss (not found) or skip (not
            judged, or a verdict waiting for correlator.pair_grace).
        - name: message
          type: text
          description: >
            One-line explanation.
        - name: episode_id
          type: keyword
          description: >
            The episode the record belongs to, as
            tropobeat.correlation.episode.id.
        - name: state
          type: keyword
          description: >
            For pair records: the pair state after the decision.
        - name: lrf
          type: group
          fields:
            - name: location
              type: geo_point
              description: >
                LRF location, when the code is in the LRF list.
        - name: input
          type: group
          description: >
            For input, skip and hysteresis records: the input and its reading.
          fields:
            - name: id
              type: keyword
              description: >
                Demod input, "<host ip>/<slot>/<input>".
            - name: host_ip
              type: ip
            - name: slot
              type: integer
            - name: input
              type: integer
            - name: side
              type: keyword
              description: >
                Demod side reported, A or B (empty when the input reports
                none).
            - name: card_label
              type: keyword
            - name: frame_label
              type: keyword
            - name: report_time
              type: date
              description: >
                Timestamp of the input's latest report.
            - name: fresh
              type: boolean
              description: >
                Whether the latest report is recent enough
                (correlator.stale_after) to count.
            - name: locked
              type: boolean
            - name: ber
              type: double
              description: >
                Latest Pre-FEC BER.
            - name: mer_db
              type: integer
              description: >
                Latest MER, dB.
            - name: power_dbm
              type: integer
              description: >
                Latest input power, dBm.
            - name: ber_effective
              type: double
              description: >
                The baseline BER a spike is measured against.
            - name: ber_threshold
              type: double
              description: >
                BER at or above which a report is a spike:
                correlator.ber_factor x ber_effective.
            - name: mer_median_db
              type: float
              description: >
                Baseline median MER, dB.
            - name: mer_threshold_db
              type: float
              description: >
                MER at or below which a report is a drop: the median minus
                correlator.mer_drop_db.
            - name: conditions
              type: keyword
              description: >
                Anomalies on the latest report: ber_spike, ber_saturated,
                mer_drop, lock_lost.
            - name: degraded
              type: boolean
              description: >
                Anomalous for correlator.hysteresis_cycles reports in a row,
                and not yet clean for as many.
            - name: stressed
              type: boolean
              description: >
                Environmentally Stressed: a BER spike held for
                correlator.hysteresis_cycles reports while locked.
            - name: bad
              type: integer
              description: >
                Consecutive anomalous reports.
            - name: good
              type: integer
              description: >
                Consecutive clean reports.
            - name: signature
              type: keyword
              description: >
                For a degraded input: steady_or_rising (power held, typical of
                interference), dropping (power fell by
                correlator.power_drop_db or more: a fade, feed or transmitter
                problem) or unlocked.
            - name: power_delta_db
              type: float
              description: >
                Power now minus the median of its clean readings before the
                degradation began, dB.
        - name: sides
          type: group
          fields:
            - name: a
              type: group
              description: >
