        - name: ducting
          type: group
          description: >
            The ducting on the co-channel paths of the channel, as looked up
            for the decision.
          fields:
            - name: status
              type: keyword
              description: >
                fresh, stale (the last weather poll is older than 2 x period)
                or no_poll.
            - name: polled_at
              type: date
              description: >
                When the ducting results were computed (weather poll time).
            - name: forecast_time
              type: date
              description: >
                The hour the weather applies to.
            - name: paths_on_channel
              type: integer
              description: >
                Co-channel paths on the LRF and channel.
            - name: paths_unknown
              type: integer
              description: >
                Of those, paths with no usable weather (an incomplete fetch):
                their ducting is unknown.
            - name: strongest
              type: group
              description: >
                The co-channel path with the highest ducting state, the
                nearest winning a tie.
              fields:
                - name: path_id
                  type: keyword
                - name: call_sign
                  type: keyword
                  description: >
                    The likely interfering transmitter.
                - name: label
                  type: keyword
                  description: >
                    Its readable name, naming the site for multi-site
                    stations, e.g. "WVER site 2 of 4 (5 kW)".
                - name: facility_id
                  type: keyword
                - name: distance_mi
                  type: float
                - name: state
                  type: keyword
                  description: >
                    normal, super_refractive, ducting or trapping.
                - name: level
                  type: integer
                  description: >
                    The state as 0 (normal) to 3 (trapping).
                - name: ducting_points
                  type: keyword
                  description: >
                    Points of the path with dM/dh < 0: lrf, midpoint,
                    transmitter.
            - name: active_path_ids
              type: keyword
              description: >
                Paths on the channel that are ducting or trapping.
            - name: active_call_signs
              type: keyword
              description: >
                Their transmitters.
            - name: active_labels
              type: keyword
              description: >
                Their transmitters' readable names (see strongest.label).
        - name: sweep
          type: group
          fields:
            - name: instances
              type: integer
            - name: expired
              type: integer
            - name: pairs
              type: integer
            - name: not_clear
              type: integer
            - name: reevaluated
              type: integer
            - name: trace_dropped
              type: long
              description: >
                Trace records dropped since start.
