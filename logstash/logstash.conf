input {
   beats {
      id    => "TROPOBEAT-INPUT"
      port  => 5057
      tags  => [ "data-routebeat" ]
   }
}

output {
   elasticsearch {
      id                 => "TROPOBEAT-ELASTIC"
      index              => "log-tropobeat-%{+YYYY.MM.dd}"
      hosts              => [ "N1.node.evertz:9200" ]
      template           => "/opt/mappings/elasticsearch-template-tropobeat.json"
      template_name      => "log-tropobeat"
      template_overwrite => true
      action             => "create"
   }

   pipeline {
     id => "TROPOBEAT-RABBIT-FORWARDER"
     send_to => "rabbitmq"
     ensure_delivery => false
   }
}